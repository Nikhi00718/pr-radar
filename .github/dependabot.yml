version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Majors open as separate PRs, so one breaking major (TypeScript 7 broke
      # typescript-eslint) does not hold back the minor and patch updates.
      web:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: uv
    directory: /collector
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      collector:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
