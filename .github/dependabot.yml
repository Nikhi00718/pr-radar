version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /collector
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      collector:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
