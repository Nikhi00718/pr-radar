name: collect

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: collector
    env:
      # A personal read-only token: the built-in GITHUB_TOKEN only gets 1,000 GraphQL points/hour.
      GH_TOKEN: ${{ secrets.RADAR_GH_TOKEN || github.token }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RADAR_SITE_URL: ${{ vars.RADAR_SITE_URL }}
      RADAR_ALERT_THRESHOLD: ${{ vars.RADAR_ALERT_THRESHOLD || '0.75' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra ml
      - name: Collect, score, publish, alert
        run: uv run radar run
