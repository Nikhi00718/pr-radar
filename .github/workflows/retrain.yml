name: retrain

on:
  schedule:
    - cron: "0 3 1 * *" # monthly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra ml
      - run: uv run python -m ml.build_dataset
      - run: uv run python -m ml.train
      - name: Commit the model report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../web/data/model_report.json
          git diff --cached --quiet || git commit -m "Update merge-probability model report"
          git push
