[project]
name = "pr-radar-collector"
version = "0.1.0"
description = "Collectors, scoring and alerts for PR Radar"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.scripts]
radar = "radar.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM"]
ignore = ["E731"]
